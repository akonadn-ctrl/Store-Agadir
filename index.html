<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:10px 0 0;
  color:#ddd;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.product img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.product-info{
  padding:15px;
}

.product h3{
  margin:5px 0 10px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-size:16px;
}

.add{
  width:100%;
  background:#111;
  color:white;
}

.cart{
  background:white;
  margin-top:30px;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.quantity button{
  padding:5px 10px;
  margin:0 3px;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin-top:20px;
}

form{
  margin-top:20px;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.order{
  width:100%;
  background:#16a34a;
  color:white;
  margin-top:10px;
}

.empty{
  color:#777;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <h1>GI WATCHES ⌚</h1>
  <p>ساعات أنيقة في أكادير</p>

</header>

<div class="container">

<h2>🛍️ الساعات</h2>

<div class="products" id="products"></div>

<div class="cart">

<div id="cartItems">

</div>

<div class="total">

</div>

<h2>📦 معلومات الطلب</h2>

<form id="orderForm">

<input
  id="name"

  placeholder="الاسم الكامل"

>

<input
  id="phone"

  placeholder="رقم الهاتف"
  required
>

<input
  id="address"

  placeholder="العنوان في أكادير"
  required
>

<textarea
  id="note"
  placeholder="ملاحظة إضافية (اختياري)"
></textarea>

<button class="order" type="submit">
  تأكيد الطلب
</button>

</form>

</div>
